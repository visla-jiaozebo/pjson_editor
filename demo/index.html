<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PJsonEditor WASM Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
        }

        .controls {
            grid-column: 1 / -1;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        textarea {
            width: 100%;
            height: 200px;
            font-family: monospace;
            font-size: 12px;
        }

        #output {
            height: 300px;
            overflow-y: auto;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }

        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }

        .status.loading {
            background-color: #fff3cd;
            border-color: #ffeaa7;
            color: #856404;
        }

        .status.ready {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }

        .status.error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
    </style>
</head>

<body>
    <h1>🚀 PJsonEditor WebAssembly Test</h1>

    <div id="status" class="status loading">Loading WASM module...</div>

    <div class="container">
    </div>

    <div class="panel">
        <h2>Output</h2>
        <div id="output"></div>
    </div>

    <script>
        var Module = {};
        let editorCreated = false;

        // Module loading callback
        Module['onRuntimeInitialized'] = async function () {
            log('✅ PJsonEditor WASM module loaded successfully!');
            setStatus('ready', 'WASM module ready - You can now use the controls');

            // get token
            let ab = await (await fetch("/demo/TOKEN_FILE")).arrayBuffer();
            const token = new TextDecoder("utf-8").decode(ab);
            log('Token fetched: ' + token.slice(0, 10) + '...');
            console.warn('Token fetched: ' + token.slice(0, 10) + '...');
            // tempEditor.setToken(token);

            testPjsonEditor(token);
        };

        Module['onAbort'] = function (what) {
            log('❌ WASM module aborted: ' + what);
            setStatus('error', 'Failed to load WASM module: ' + what);
        };

        function log(message) {
            const output = document.getElementById('output');
            const timestamp = new Date().toLocaleTimeString();
            output.textContent += `[${timestamp}] ${message}\n`;
            output.scrollTop = output.scrollHeight;
        }

        function setStatus(type, message) {
            const statusElement = document.getElementById('status');
            statusElement.className = `status ${type}`;
            statusElement.textContent = message;
        }

        function clearOutput() {
            document.getElementById('output').textContent = '';
        }

        function createEditor() {
            try {
                log('🔧 Creating PJsonEditor instance...');
                const success = Module.createEditor();
                if (success) {
                    log('✅ Editor created successfully!');
                    editorCreated = true;
                } else {
                    log('❌ Failed to create editor');
                }
            } catch (e) {
                log('❌ Error creating editor: ' + e.message);
            }
        }
        function CHECK(condition, message) {
            if ((typeof condition === 'function') && !condition()) {
                throw new Error(message || "Check failed");
            }
            if (condition === false) {
                throw new Error(message || "Check failed");
            }
        }
        // request: {method, url, body, headers}
        async function testAnyRequest(editor, token, request) {
            let localResp = editor.call(request);
            let r = fetch(request.url, {
                method: request.method,
                headers: request.headers,
                body: JSON.stringify(request.body)
            });

            if (localResp.status_code !== 200) {
                let resp = await r;
                if (resp.ok) {
                    let respBody = await resp.json();
                    editor.feedServerResponse(localResp, respBody);
                    return respBody;
                } else {
                    throw new Error("Request failed with status: " + resp.status);
                }
            } else {
                return localResp.body;
            }
        }

        async function testPjsonEditor(token) {
            log('🔍 Running initial tests on PJsonEditor...');
            // const baseURL = "https://api-snapshot.dev01.vislaus.cn";
            const baseURL = "";
            const PROPJECT_UUID = "1358840261077225472";
            const editor = new Module.PJsonEditorModule();
            try {
                let scene_list = await fetch(`${baseURL}/v3/project/${PROPJECT_UUID}/scene/list`, {
                    headers: {
                        "Content-Type": "application/json",
                        "token": token
                    }
                });
                if (!scene_list.ok) {
                    return log('❌ Failed to fetch scene list: ' + scene_list.status);
                }
                editor.update(await scene_list.json());
                let sceneUuid = ""
                {
                    // add scene
                    let addSceneBody = {
                        "addPosition": 1,
                        "duration": 10000
                    };
                    let localResp = editor.call({
                        method: "POST",
                        url: `/v3/project/${PROPJECT_UUID}/scene/add`,
                        body: addSceneBody,
                        headers: {
                            "Content-Type": "application/json",
                            "token": token
                        }
                    });
                    // localResp.code == 404;
                    CHECK(localResp.status_code === 404, "Add scene call failed with:" + JSON.stringify(localResp));

                    let addSceneResponse = await (await fetch(`${baseURL}/v3/project/${PROPJECT_UUID}/scene/add`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "token": token
                        },
                        body: JSON.stringify(addSceneBody)
                    })).json();
                    sceneUuid = addSceneResponse["data"]["sceneUuid"];
                    editor.feedServerResponse(localResp, addSceneResponse);
                    // JSON.parse(localResp);
                }
                {
                    // "scene/rename"
                    let renameBody = {
                        "sceneUuid": sceneUuid,
                        "name": "Renamed Scene" + sceneUuid
                    };

                    let localResp = editor.call({
                        method: "PUT",
                        url: `/v3/project/${PROPJECT_UUID}/scene/rename`,
                        body: renameBody,
                        headers: {
                            "Content-Type": "application/json",
                            "token": token
                        }
                    });
                    CHECK(localResp.status_code === 200, "Rename scene call failed with:" + localResp.status_code);
                    let localBody = localResp.body;
                    CHECK(localBody["data"]["scene"]["name"] === "Renamed Scene" + sceneUuid, "name is not same");

                    let renameResponse = await fetch(`${baseURL}/v3/project/${PROPJECT_UUID}/scene/rename`, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json",
                            "token": token
                        },
                        body: JSON.stringify(renameBody)
                    });
                    CHECK(renameResponse.status === 200, "Rename scene call failed with:" + renameResponse.status);

                    let serverBody = await renameResponse.json();
                    CHECK(localBody["data"]["scene"]["name"] === serverBody["data"]["scene"]["name"], "name is not same");
                    log('✅ Test passed: Scene renamed successfully: ' + localBody["data"]["scene"]["name"]);
                }
                // get json data from response

                // add footage & edit footage
                {

                }

                // delete scene
                {
                    let resp = await testAnyRequest(editor, token, {
                        method: "DELETE",
                        url: `/v3/project/${PROPJECT_UUID}/scene/delete`,
                        body: {
                            "sceneUuid": sceneUuid
                        },
                        headers: {
                            "Content-Type": "application/json",
                            "token": token
                        }
                    });
                    CHECK(resp["code"] === 0, "delete error");
                    log('✅ Test passed: Scene deleted successfully: ' + sceneUuid);
                }
            } catch (e) {
                log('❌ Test failed: ' + e.message);
                console.error(e);
            }
            finally {
                editor.delete();
            }
        }

    </script>

    <!-- Load the generated WASM module -->
    <script src="/build_wasm/PJsonEditor/pjson_editor_wasm.js"></script>
</body>

</html>
